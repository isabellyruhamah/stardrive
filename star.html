<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarDrive — Assistente de Motoristas</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #1f2937;
  }
  header {
    background: #111827;
    color: white;
    padding: 28px 20px;
  }
  .header-content {
    max-width: 1100px;
    margin: auto;
  }
  .logo { font-size: 28px; font-weight: 800; }
  .logo span { color: #22c55e; }
  .subtitle { margin: 7px 0 0; color: #cbd5e1; }
  main {
    max-width: 1100px;
    margin: 28px auto;
    padding: 0 20px 50px;
  }
  .panel {
    background: white;
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
    margin-bottom: 22px;
  }
  h2 { margin-top: 0; }
  .filters {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 7px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    background: white;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 11px;
    background: #22c55e;
    color: #052e16;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #16a34a; }
  .result-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .cards {
    display: grid;
    gap: 14px;
  }
  .driver {
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 18px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 16px;
  }
  .rank {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #ecfdf5;
    color: #15803d;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 18px;
  }
  .driver h3 { margin: 0 0 6px; }
  .meta {
    color: #6b7280;
    font-size: 14px;
    line-height: 1.6;
  }
  .score {
    text-align: right;
  }
  .score strong {
    display: block;
    font-size: 25px;
    color: #16a34a;
  }
  .stars { color: #f59e0b; }
  .tag {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 8px;
    border-radius: 999px;
    background: #f3f4f6;
    font-size: 12px;
    font-weight: 700;
  }
  .empty {
    text-align: center;
    padding: 35px;
    color: #6b7280;
  }
  .note {
    font-size: 12px;
    color: #6b7280;
    margin-top: 12px;
  }
  @media (max-width: 750px) {
    .filters { grid-template-columns: 1fr; }
    .driver { grid-template-columns: auto 1fr; }
    .score { grid-column: 2; text-align: left; }
    .result-info { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="logo">Drive<span>Select</span></div>
    <p class="subtitle">Assistente inteligente para encontrar os motoristas mais bem avaliados</p>
  </div>
</header>

<main>
  <section class="panel">
    <h2>🔎 Encontre o melhor motorista</h2>

    <div class="filters">
      <div>
        <label for="rating">Nota mínima</label>
        <input id="rating" type="number" min="1" max="5" step="0.1" value="4.8">
      </div>

      <div>
        <label for="trips">Viagens mínimas</label>
        <input id="trips" type="number" min="0" value="500">
      </div>

      <div>
        <label for="category">Categoria</label>
        <select id="category">
          <option value="Todas">Todas</option>
          <option value="UberX">UberX</option>
          <option value="Comfort">Comfort</option>
          <option value="Black">Black</option>
        </select>
      </div>

      <div>
        <label for="gender">Motorista</label>
        <select id="gender">
          <option value="Todos">Homem ou mulher</option>
          <option value="Mulher">Mulher</option>
          <option value="Homem">Homem</option>
        </select>
      </div>
    </div>

    <button onclick="findDrivers()">Encontrar melhores motoristas</button>
    <div class="note">Os motoristas exibidos são fictícios e servem apenas para demonstração do protótipo.</div>
  </section>

  <section class="panel">
    <div class="result-info">
      <h2>Resultados</h2>
      <strong id="count"></strong>
    </div>
    <div id="results" class="cards"></div>
  </section>
</main>

<script>
const drivers = [
  { name: "Marcos Silva", gender: "Homem", rating: 4.99, trips: 1840, category: "Comfort", positive: 99 },
  { name: "Ana Beatriz", gender: "Mulher", rating: 4.98, trips: 1260, category: "Black", positive: 98 },
  { name: "Carlos Henrique", gender: "Homem", rating: 4.97, trips: 2340, category: "UberX", positive: 97 },
  { name: "Juliana Costa", gender: "Mulher", rating: 4.96, trips: 890, category: "Comfort", positive: 99 },
  { name: "Rafael Santos", gender: "Homem", rating: 4.95, trips: 3100, category: "UberX", positive: 96 },
  { name: "Camila Oliveira", gender: "Mulher", rating: 4.94, trips: 720, category: "Black", positive: 98 },
  { name: "Lucas Almeida", gender: "Homem", rating: 4.92, trips: 540, category: "UberX", positive: 95 },
  { name: "Fernanda Lima", gender: "Mulher", rating: 4.90, trips: 480, category: "Comfort", positive: 94 },
  { name: "João Pedro", gender: "Homem", rating: 4.87, trips: 610, category: "UberX", positive: 93 }
];

function calculateScore(driver) {
  const ratingScore = (driver.rating / 5) * 60;
  const tripsScore = Math.min(driver.trips / 2000, 1) * 20;
  const positiveScore = (driver.positive / 100) * 20;
  return ratingScore + tripsScore + positiveScore;
}

function findDrivers() {
  const minRating = Number(document.getElementById("rating").value);
  const minTrips = Number(document.getElementById("trips").value);
  const category = document.getElementById("category").value;
  const gender = document.getElementById("gender").value;

  const filtered = drivers
    .filter(driver => driver.rating >= minRating)
    .filter(driver => driver.trips >= minTrips)
    .filter(driver => category === "Todas" || driver.category === category)
    .filter(driver => gender === "Todos" || driver.gender === gender)
    .map(driver => ({ ...driver, score: calculateScore(driver) }))
    .sort((a, b) => b.score - a.score);

  const results = document.getElementById("results");
  const count = document.getElementById("count");

  count.textContent = `${filtered.length} encontrado(s)`;

  if (filtered.length === 0) {
    results.innerHTML = `
      <div class="empty">
        <h3>Nenhum motorista encontrado</h3>
        <p>Tente diminuir a nota mínima ou a quantidade mínima de viagens.</p>
      </div>`;
    return;
  }

  results.innerHTML = filtered.map((driver, index) => `
    <article class="driver">
      <div class="rank">${index + 1}</div>

      <div>
        <h3>${driver.name}</h3>
        <div class="stars">★ ${driver.rating.toFixed(2)}</div>
        <div class="meta">
          ${driver.gender} ·
          ${driver.trips.toLocaleString("pt-BR")} viagens ·
          ${driver.positive}% de avaliações positivas
        </div>
        <span class="tag">${driver.category}</span>
      </div>

      <div class="score">
        <strong>${driver.score.toFixed(1)}</strong>
        <small>pontuação</small>
      </div>
    </article>
  `).join("");
}

findDrivers();
</script>

</body>
</html>
